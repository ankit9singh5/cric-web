spring:
  application:
    name: player-service
  datasource:
    url: jdbc:postgresql://localhost:5432/cricket_db
    username: cricket_user
    password: cricket_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

server:
  port: 8082

springdoc:
  swagger-ui:
    path: /swagger-ui.html
